<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgVault" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="50%" stop-color="#140728"/>
      <stop offset="100%" stop-color="#070210"/>
    </linearGradient>
    <linearGradient id="goldVault" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glowVault" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgVault)"/>

  <!-- Circuit Pattern Background -->
  <g stroke="#3b1d6e" stroke-width="1.5" opacity="0.35">
    <path d="M 50 100 H 200 L 250 150 H 350"/>
    <path d="M 50 350 H 220 L 270 300 H 380"/>
    <path d="M 750 100 H 600 L 550 150 H 450"/>
    <path d="M 750 350 H 580 L 530 300 H 420"/>
    <circle cx="200" cy="100" r="4" fill="#a855f7"/>
    <circle cx="600" cy="100" r="4" fill="#a855f7"/>
    <circle cx="220" cy="350" r="4" fill="#f59e0b"/>
    <circle cx="580" cy="350" r="4" fill="#f59e0b"/>
  </g>

  <!-- Central Holographic Vault Shield -->
  <g transform="translate(400, 210)" filter="url(#glowVault)">
    <!-- Outer Vault Ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 8"/>
    <circle cx="0" cy="0" r="95" fill="#140a2c" stroke="url(#goldVault)" stroke-width="2"/>

    <!-- Shield Emblem -->
    <path d="M 0 -60 L 45 -40 V 10 C 45 45, 0 65, 0 65 C 0 65, -45 45, -45 10 V -40 Z" fill="url(#shieldGrad)" opacity="0.9"/>
    
    <!-- Padlock Graphic inside Shield -->
    <path d="M -16 -5 C -16 -18, 16 -18, 16 -5 V 8 H -16 Z" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
    <rect x="-24" y="5" width="48" height="38" rx="8" fill="url(#goldVault)"/>
    <circle cx="0" cy="20" r="5" fill="#0f0724"/>
    <path d="M 0 25 V 34" stroke="#0f0724" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Cryptography Badges -->
  <g transform="translate(140, 180)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="#1e103c" stroke="#a855f7" stroke-width="1.5"/>
    <text x="80" y="26" text-anchor="middle" fill="#fdf4ff" font-family="monospace" font-size="13" font-weight="bold">AES-GCM 256-bit</text>
  </g>

  <g transform="translate(500, 180)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="#1e103c" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="80" y="26" text-anchor="middle" fill="#fdf4ff" font-family="monospace" font-size="13" font-weight="bold">PBKDF2 100k Rondas</text>
  </g>

  <!-- Top Badge -->
  <rect x="250" y="35" width="300" height="32" rx="16" fill="#170c32" stroke="#a855f7" stroke-width="1"/>
  <text x="400" y="56" text-anchor="middle" fill="#e9d5ff" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1.5">
    ZERO-KNOWLEDGE SECURITY
  </text>

  <!-- Title Bottom -->
  <text x="400" y="380" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900" letter-spacing="0.5">
    CAJA FUERTE ZERO-KNOWLEDGE
  </text>
  <text x="400" y="405" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="bold">
    Bóveda Criptográfica en Cliente &amp; Asistente IA
  </text>
</svg>
