name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quality gate and static export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit

      - name: Export static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ''

      - name: Check routes and portfolio content
        run: npm run check:portfolio

      - name: Save Cloudflare Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-out
          path: out/
          if-no-files-found: error
          retention-days: 2

  deploy:
    name: Deploy Cloudflare Pages production
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Cloudflare deployment secrets
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are available." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets." >> "$GITHUB_STEP_SUMMARY"
            echo "Required Cloudflare Actions secrets are not configured; build passed but production was not changed."
          fi

      - name: Checkout
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked Wrangler
        if: steps.credentials.outputs.ready == 'true'
        run: npm ci

      - name: Download site artifact
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages-out
          path: out/

      - name: Publish static site to Cloudflare Pages
        if: steps.credentials.outputs.ready == 'true'
        run: npx wrangler pages deploy ./out --project-name=portafolio-xaviercabello --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
